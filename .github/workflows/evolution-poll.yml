name: Evolution API Polling

# Recupera mensajes perdidos del webhook llamando al endpoint de polling.
# Migrado desde Supabase pg_cron para reducir egress.
# El webhook sigue siendo la vía principal; esto es fallback.

on:
  schedule:
    # Cada 5 minutos (GitHub Actions puede retrasarse 5-15 min en horas pico)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Call polling endpoint
        run: |
          ACTIVE_URL=$(curl -sf -m 10 \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6Y3l4ZXJhY3ZmeHluZGR5amxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1MTE5NTQsImV4cCI6MjA5MTA4Nzk1NH0.DvEnK-g5rMxzFec4Fl3rJ5VDYVJ7-ua9ssqf3s-QKtU" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6Y3l4ZXJhY3ZmeHluZGR5amxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1MTE5NTQsImV4cCI6MjA5MTA4Nzk1NH0.DvEnK-g5rMxzFec4Fl3rJ5VDYVJ7-ua9ssqf3s-QKtU" \
            "https://kzcyxeracvfxynddyjld.supabase.co/rest/v1/sek_app_settings?key=eq.active_app_server&select=value" \
            | python3 -c "import sys,json; rows=json.load(sys.stdin); v=rows[0]['value'] if rows else '{}'; d=json.loads(v) if isinstance(v,str) else v; print((d or {}).get('url','').rstrip('/'))")
          if [ -z "$ACTIVE_URL" ]; then
            echo "Servidor sin URL activa publicada; omitiendo ciclo."
            exit 0
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" -m 55 "${ACTIVE_URL}/api/evolution/poll" || true)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "530" ]; then
            echo "Servidor apagado o túnel inactivo ($HTTP_CODE); omitiendo ciclo."
            exit 0
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Polling failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Polling OK"
