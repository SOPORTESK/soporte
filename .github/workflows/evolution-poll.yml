name: Evolution API Polling

# Recupera mensajes perdidos del webhook llamando al endpoint de polling.
# Migrado desde Supabase pg_cron para reducir egress.
# El webhook sigue siendo la vía principal; esto es fallback.

on:
  schedule:
    # Cada 5 minutos (GitHub Actions puede retrasarse 5-15 min en horas pico)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Call polling endpoint
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -m 55 "https://sekachat.vercel.app/api/evolution/poll")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Polling failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Polling OK"
